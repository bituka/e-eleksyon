server:
  port: 8080

spring:
  application:
    name: eeleksyon-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eeleksyon}
    username: ${DB_USER:eeleksyon}
    password: ${DB_PASSWORD:eeleksyon}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:your-very-long-secret-key-here-at-least-256-bits}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.eeleksyon: DEBUG
    org.springframework.security: DEBUG