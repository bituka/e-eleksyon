version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eeleksyon-db
    environment:
      POSTGRES_DB: eeleksyon
      POSTGRES_USER: eeleksyon
      POSTGRES_PASSWORD: eeleksyon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eeleksyon -d eeleksyon"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eeleksyon-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: eeleksyon
      DB_USER: eeleksyon
      DB_PASSWORD: eeleksyon
      JWT_SECRET: "your-very-long-secret-key-here-at-least-256-bits-for-production-use"
      JWT_EXPIRATION: "86400000"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eeleksyon-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: